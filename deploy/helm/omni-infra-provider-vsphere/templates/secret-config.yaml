{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-infra-provider-vsphere.fullname" . }}-config
  namespace: {{ include "omni-infra-provider-vsphere.namespace" . }}
  labels:
    {{- include "omni-infra-provider-vsphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- .Values.config | toYaml | nindent 4 }}
{{- end }}
