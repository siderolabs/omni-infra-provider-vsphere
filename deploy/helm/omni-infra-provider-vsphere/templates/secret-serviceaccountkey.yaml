{{- if not .Values.omni.serviceAccountKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-infra-provider-vsphere.fullname" . }}-service-account-key
  namespace: {{ include "omni-infra-provider-vsphere.namespace" . }}
  labels:
    {{- include "omni-infra-provider-vsphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNI_SERVICE_ACCOUNT_KEY: {{ .Values.omni.serviceAccountKey.value | quote }}
{{- end }}
