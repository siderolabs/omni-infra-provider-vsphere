{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omni-infra-provider-vsphere.serviceAccountName" . }}
  namespace: {{ include "omni-infra-provider-vsphere.namespace" . }}
  labels:
    {{- include "omni-infra-provider-vsphere.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
