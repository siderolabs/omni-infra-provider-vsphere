suite: Config Secret Logic
templates:
  - secret-config.yaml
set:
  omni:
    endpoint: https://omni.test.local
    serviceAccountKey:
      existingSecret: test-key-secret
  config:
    vsphere:
      uri: https://vcenter.test.local/sdk
      user: test-user
      password: test-password

tests:
  # ========================================
  # Config Secret Creation Tests
  # ========================================
  - it: Should create Config Secret when existingConfigSecret is not set
    template: secret-config.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-infra-provider-vsphere-config

  - it: Should not create Config Secret when existingConfigSecret is set
    template: secret-config.yaml
    set:
      existingConfigSecret: my-provider-config
    asserts:
      - hasDocuments:
          count: 0

  - it: Should have correct secret type
    template: secret-config.yaml
    asserts:
      - equal:
          path: type
          value: Opaque

  # ========================================
  # Config Content Tests
  # ========================================
  - it: Should include config.yaml data
    template: secret-config.yaml
    asserts:
      - isNotNull:
          path: stringData["config.yaml"]

  - it: Should render the vSphere connection settings
    template: secret-config.yaml
    set:
      config:
        vsphere:
          uri: https://vcenter.example.org/sdk
          user: omni@vsphere.local
          password: s3cret
          insecureSkipVerify: true
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "^vsphere:\n"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "uri: https://vcenter.example.org/sdk"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "user: omni@vsphere.local"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "password: s3cret"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "insecureSkipVerify: true"

  - it: Should not skip vCenter TLS verification by default
    template: secret-config.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "insecureSkipVerify: false"

  # ========================================
  # Metadata Tests
  # ========================================
  - it: Should include standard Helm labels
    template: secret-config.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: omni-infra-provider-vsphere
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]

  - it: Should be created in correct namespace
    template: secret-config.yaml
    release:
      namespace: custom-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
