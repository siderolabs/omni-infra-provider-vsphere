suite: Service Account Key Secret Logic
templates:
  - secret-serviceaccountkey.yaml
set:
  omni:
    endpoint: https://omni.test.local
  existingConfigSecret: test-config-secret

tests:
  # ========================================
  # Secret Creation Tests
  # ========================================
  - it: Should create secret when existingSecret is not set
    template: secret-serviceaccountkey.yaml
    set:
      omni:
        serviceAccountKey:
          existingSecret: ""
          value: dGVzdC1rZXk=
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-infra-provider-vsphere-service-account-key

  - it: Should not create secret when existingSecret is set
    template: secret-serviceaccountkey.yaml
    set:
      omni:
        serviceAccountKey:
          existingSecret: my-pre-existing-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: Should have correct secret type
    template: secret-serviceaccountkey.yaml
    set:
      omni:
        serviceAccountKey:
          existingSecret: ""
          value: test-key
    asserts:
      - equal:
          path: type
          value: Opaque

  # ========================================
  # Key Content Tests
  # ========================================
  - it: Should store the key in stringData under OMNI_SERVICE_ACCOUNT_KEY
    template: secret-serviceaccountkey.yaml
    set:
      omni:
        serviceAccountKey:
          existingSecret: ""
          value: dGVzdC1rZXk=
    asserts:
      - equal:
          path: stringData["OMNI_SERVICE_ACCOUNT_KEY"]
          value: dGVzdC1rZXk=

  # ========================================
  # Metadata Tests
  # ========================================
  - it: Should include standard Helm labels
    template: secret-serviceaccountkey.yaml
    set:
      omni:
        serviceAccountKey:
          existingSecret: ""
          value: test-key
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: omni-infra-provider-vsphere
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]

  - it: Should be created in correct namespace
    template: secret-serviceaccountkey.yaml
    release:
      namespace: custom-namespace
    set:
      omni:
        serviceAccountKey:
          existingSecret: ""
          value: test-key
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
