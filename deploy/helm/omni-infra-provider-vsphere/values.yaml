# -- Provide a name in place of `"omni-infra-provider-vsphere"`.
nameOverride: ""

# -- String to fully override `"omni-infra-provider-vsphere.fullname"`.
fullnameOverride: ""

# -- String to fully override `"omni-infra-provider-vsphere.namespace"`.
namespaceOverride: ""

# Deployment strategy. The provider always runs as a single replica: every instance registered
# under the same provider ID would act on the same provision requests. Recreate makes sure the
# old instance has disconnected from Omni before the new one starts.
strategy:
  # -- Deployment strategy type.
  type: Recreate

# Provider image configuration.
image:
  # -- Repository to use for the provider.
  repository: ghcr.io/siderolabs/omni-infra-provider-vsphere
  # -- Image pull policy for the provider.
  pullPolicy: IfNotPresent
  # -- Tag to use for the provider.
  # @default -- `.Chart.AppVersion`
  tag: ""

# -- Secrets with credentials to pull images from a private registry.
imagePullSecrets: []

# -- Extra arguments to pass to the provider.
# Note: --config-file, --omni-api-endpoint, --id, --provider-name, --provider-description and --insecure-skip-verify are generated by the chart from the values below.
args: []

# How the provider registers itself in Omni.
provider:
  # -- ID of the infrastructure provider.
  # It must match the ID the provider was created with in Omni (`omnictl infraprovider create <id>`)
  # and the `providerid` of the machine classes that use it.
  id: vsphere
  # -- Provider name as it appears in Omni.
  name: vsphere
  # -- Provider description as it appears in Omni.
  description: vsphere infrastructure provider

# Omni connection.
omni:
  # -- URL of the Omni API the provider connects to.
  # MUST be specified as a full URL, including scheme (https://).
  # This is the advertised URL of the Omni API (`config.services.api.advertisedURL` in the Omni chart).
  endpoint: https://omni.example.com
  # -- Skip TLS certificate verification for the Omni API.
  insecureSkipVerify: false
  # Omni service account key the provider authenticates with.
  # It is printed once when the infrastructure provider is created in Omni (`omnictl infraprovider create <id>`).
  serviceAccountKey:
    # -- Name of an existing Secret that holds the service account key.
    # If set, `value` is ignored and the chart does not create a Secret.
    existingSecret: ""
    # -- Key inside the existing Secret that holds the service account key.
    existingSecretKey: OMNI_SERVICE_ACCOUNT_KEY
    # -- The service account key, as shown by Omni.
    # It is stored in a Secret managed by the chart.
    value: ""

# Provider Configuration
#
# Rendered as-is into the provider config file (`--config-file`).
# The file is stored in a Secret, since it contains the vSphere password.
config:
  vsphere:
    # -- URL of the vCenter SDK endpoint.
    uri: https://vcenter.example.com/sdk
    # -- vSphere user the provider logs in with.
    user: ""
    # -- Password of the vSphere user.
    # Tip: use `existingConfigSecret` to load the whole config file from a Secret managed outside the chart.
    password: ""
    # -- Skip TLS certificate verification for vCenter.
    # Prefer adding the vCenter CA certificate to the container trust store with `extraVolumes`/`extraVolumeMounts` instead.
    insecureSkipVerify: false

# -- Name of an existing Secret that holds the provider config file.
# If set, the `config` section is ignored and the chart does not create a config Secret.
# This is useful for bringing in the vSphere credentials from an external source (e.g., External Secrets Operator).
existingConfigSecret: ""

# -- Key inside `existingConfigSecret` that holds the provider config file.
existingConfigSecretKey: config.yaml

# -- Environment variables to pass to the provider.
env: []

# -- envFrom to pass to the provider.
envFrom: []

# -- Liveness probe for the provider container.
# The provider exposes no HTTP endpoint, so no probe is configured by default.
livenessProbe: {}

# -- Readiness probe for the provider container.
readinessProbe: {}


# Resources Configuration
# -- CPU and Memory resource requests and limits.
resources: {}
#limits:
#  cpu: 100m
#  memory: 128Mi
#requests:
#  cpu: 100m
#  memory: 128Mi


# -- Container-level security context.
# The provider is a static binary that only makes outbound connections, so it runs unprivileged on a read-only root filesystem.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Service Account Configuration
serviceAccount:
  # -- Whether to create a ServiceAccount for the provider
  create: true
  # -- Automount API credentials for a ServiceAccount.
  # The provider does not use the Kubernetes API.
  automount: false
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- List of additional mounts to add (normally used with extraVolumes)
extraVolumeMounts: []
#  - name: vcenter-ca
#    mountPath: /etc/ssl/certs/vcenter-ca.crt
#    subPath: vcenter-ca.crt
#    readOnly: true

# -- List of extra volumes to add
extraVolumes: []
#  - name: vcenter-ca
#    configMap:
#      name: vcenter-ca

# -- Pod affinity settings for the provider pod
affinity: {}

# -- Node selector to constrain which nodes the provider pod is scheduled on
nodeSelector: {}

# -- Additional annotations to add to the provider pod
podAnnotations: {}

# -- Additional labels to add to the provider pod
podLabels: {}

# -- DNS policy for the provider pod.
dnsPolicy: ""

# -- DNS configuration for the provider pod.
dnsConfig: {}
#  nameservers:
#    - 1.1.1.1
#  searches:
#    - my-domain.local

# -- Priority class name for the provider pod.
priorityClassName: ""

# -- Termination grace period in seconds for the provider pod.
terminationGracePeriodSeconds: 30

# -- Init containers to add to the provider pod.
initContainers: []

# -- Extra containers (sidecars) to add to the provider pod.
extraContainers: []

# -- Pod-level security context
podSecurityContext: {}

# -- Tolerations for the provider pod
tolerations: []

# -- Extra Kubernetes objects to deploy with the helm chart
extraObjects: []
#- apiVersion: v1
#  kind: ConfigMap
#  metadata:
#    name: vcenter-ca
#  data:
#    vcenter-ca.crt: |
#      -----BEGIN CERTIFICATE-----
#      ...
#      -----END CERTIFICATE-----
